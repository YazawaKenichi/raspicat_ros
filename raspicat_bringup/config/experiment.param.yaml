relief_detector:
  ros__parameters:
    pub_rate: 1.0
    ADC_Subscriber_Topic_Name: "/obstacle_detecting_bar/raw"
    Normalized_Publishser_Topic_Name: "/relief_detector/bar/normalized"
    saving_raw_data_directory: "/dev/null"
    saving_normalized_data_directory: "/dev/null"

relief_stopper_pre:
  ros__parameters:
    raw_cmd_vel_topic_name: "/joy_vel"
    processed_cmd_vel_topic_name: "/relief_vel"
    bar_angle_topic_name: "/relief_detector/bar/normalized"
    relief_threshold: 91.5
    reverse: false
    saving_raw_data_directory: "/dev/null"
    saving_stopping_data_directory: "/dev/null"

relief_stopper_post:
  ros__parameters:
    raw_cmd_vel_topic_name: "/smoothed_vel"
    processed_cmd_vel_topic_name: "/cmd_vel"  # launch 引数 output_vel で上書きされる
    bar_angle_topic_name: "/relief_detector/bar/normalized"
    relief_threshold: 91.5
    reverse: false
    saving_raw_data_directory: "/dev/null"
    saving_stopping_data_directory: "/dev/null"

teleop_twist_joy_node:
  ros__parameters:
    axis_linear: 
      x: 1
    scale_linear_autorun:
      x: 1.0
    axis_angular:
      yaw: 0
    axis_angular_adjustment:
      yaw: 3
    ems_button: 5
    enable_autorun_button: 4
    autorun_forward_button: 3
    autorun_backward_button: 0

    enable_experiment_button: 3
    scale_linear_experiment:
      x: 0.2
      y: 0.0
      z: 0.0
    scale_angular_experiment:
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

lifecycle_manager_velocity_smoother:
  ros__parameters:
    autostart: true
    node_names: ["velocity_smoother_node"]

velocity_smoother_node:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 0.0, 1.0]
    min_velocity: [-1.0, 0.0, -1.0]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: "odom"
    odom_duration: 0.1

phone_camera:
  ros__parameters:
    camera_url: "/dev/v4l/by-id/usb-Generic_FULL_HD_1080P_Webcam_200901010001-video-index0"
    width: 1280
    height: 720
    fps: 30.0
    frame_id: "usb_camera"

